name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the release files
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Installing and building run third-party code, so this job can only read.
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build the Chrome, Edge and Firefox zips
        run: pnpm zip:all

      - name: Take the release notes from the changelog
        run: |
          awk -v version="${VERSION}" '
            /^## \[/ { printing = index($0, "[" version "]") > 0; next }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > .output/release-notes.md

          if [ ! -s .output/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi

      - name: Keep the files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            .output/swift-todo-*-chrome.zip
            .output/swift-todo-*-edge.zip
            .output/swift-todo-*-firefox.zip
            .output/swift-todo-*-sources.zip
            .output/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that can write, and it runs nothing from the repository or its dependencies.
    permissions:
      contents: write

    steps:
      - name: Get the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/swift-todo-*-chrome.zip \
            release/swift-todo-*-edge.zip \
            release/swift-todo-*-firefox.zip \
            release/swift-todo-*-sources.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release/release-notes.md \
            --verify-tag
