name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: [bug]
type: Bug
assignees:
  - eoussama
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Swift TODO are you running? You can find it on the browser's extensions page.
      placeholder: ex. 2.0.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browsers are you seeing the problem in?
      multiple: true
      options:
        - Chrome
        - Edge
        - Firefox
        - Other Chromium-based browser
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser version and operating system.
      placeholder: ex. Chrome 142, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant console output from the popup or the extension's service worker. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/eoussama/swift-todo/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
