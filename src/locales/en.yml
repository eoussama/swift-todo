# Keys: "+" joins keys pressed together, " / " separates alternatives.
shortcuts:
  add:
    action: Add the to-do
    keys: Enter
  focusInput:
    action: Jump to the input
    keys: /
  navigate:
    action: Move between to-dos
    keys: ↑ / ↓
  toggle:
    action: Check off
    keys: Space
  edit:
    action: Edit
    keys: Enter / F2
  delete:
    action: Move to the trash
    keys: Delete
  reorder:
    action: Reorder
    keys: Alt+↑ / ↓
  sync:
    action: Sync on or off
    keys: S
  menu:
    action: More actions
    keys: M
  view:
    action: View in full
    keys: V
  undo:
    action: Undo delete
    keys: Ctrl+Z

toast:
  deleted: Moved “$1” to the trash
  cleared:
    1: Moved 1 done to-do to the trash
    n: Moved $1 done to-dos to the trash
  undo: Undo

errors:
  empty: A to-do can't be empty.
  notFound: That to-do no longer exists.
  syncFull: Sync storage is full. Keep another to-do on this device to make room.
  syncUnavailable: Sync is off in this browser.
  tooManyLists: You've reached the list limit. Delete a list to add another.
  invalidBackup: That file isn't a Swift TODO backup.
  unknown: Something went wrong, so your last change may not be saved.
